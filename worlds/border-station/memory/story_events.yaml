memory_type: story_events
description: |
  成功正文回合产生的故事事件长期记忆。只记录故事世界内已经发生、
  被确认或被揭示的事件，不记录系统操作本身。
  每个成功 RP 正文回合只要发生了可被玩家后续回忆的具体事件，
  至少创建一条 story_events 记忆。事件可以来自 assistant 正文，
  user 输入只作为上下文。不要因为事件发生在虚构世界而跳过。
  例如“林澈把北门银钥匙交给玩家并确认北门打开”应写入 story_events。
directory: "viking://user/{{ user_space }}/memories/story_events"
filename_template: "{{ event_name }}.md"
operation_mode: add_only
enabled: true
content_template: |-
  Summary: {{ summary }}

  ProseExcerpt: {{ prose_excerpt }}

  Source: {{ source }}
embedding_template: |-
  {{ event_name }}

  {{ summary }}

  {{ prose_excerpt }}
overview_template: |-
  # Story Events Overview
  {% for item in items %}
  - [{{ item.file_content.summary|default(item.file_name, true) }}](./{{ item.file_name }})
  {% endfor %}
fields:
  - name: event_name
    type: string
    description: |
      简短事件名。使用中文，命名一个具体故事事件，不写日期、
      时间或数字，不使用宽泛主题名。必须在同一 save 内稳定唯一，
      优先组合角色、地点、动作，例如“末声在边境驿站辨认信使箭伤”。
    merge_op: immutable

  - name: summary
    type: string
    description: |
      事件摘要。聚焦故事世界中已经发生、被确认或被揭示的事实。
      对成功 RP 正文回合，优先记录已经成立的动作结果、获得物、
      角色承诺、地点变化和剧情揭示。

  - name: prose_excerpt
    type: string
    description: |
      writer 正文短摘录。只从 assistant 正文中摘取关键片段，
      不摘玩家输入。

  - name: source
    type: string
    description: 固定填写 assistant。
    init_value: assistant
    merge_op: immutable
