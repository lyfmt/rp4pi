name: Bug 报告
description: 报告可复现的运行时、世界包或工具问题
title: "[Bug]: "
labels: [bug]
body:
  - type: checkboxes
    attributes:
      label: 提交前检查
      options:
        - label: 我已确认当前 `main` 分支仍存在该问题
          required: true
        - label: 我已移除日志、配置和附件中的密钥与个人数据
          required: true

  - type: textarea
    attributes:
      label: 问题描述
      description: 说明实际发生了什么，以及它造成的影响。
    validations:
      required: true

  - type: textarea
    attributes:
      label: 复现步骤
      placeholder: |
        1. 使用世界包 ...
        2. 运行 ...
        3. 输入 ...
        4. 出现 ...
    validations:
      required: true

  - type: textarea
    attributes:
      label: 预期行为
    validations:
      required: true

  - type: input
    attributes:
      label: 版本
      description: 提交哈希或分支名称。
    validations:
      required: true

  - type: textarea
    attributes:
      label: 环境
      description: Node.js、Pi、操作系统以及是否启用 OpenViking。
      render: text
    validations:
      required: true

  - type: textarea
    attributes:
      label: 相关日志
      description: 仅提供必要片段；不要包含 API Key、认证信息、会话正文或存档。
      render: shell
